<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <!-- Technical floor grid -->
    <pattern id="floor-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#FFFFFF"/>
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F1F5F9" stroke-width="1"/>
    </pattern>

    <!-- Hazard Stripes for Maintenance -->
    <pattern id="hazard-pattern" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="16" fill="#F49E03"/>
      <rect x="8" width="8" height="16" fill="#051E4B"/>
    </pattern>

    <!-- Zebra Crosswalks -->
    <pattern id="zebra-v" width="24" height="12" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="24" height="6" fill="#FFFFFF"/>
      <rect x="0" y="6" width="24" height="6" fill="#16A34A"/>
    </pattern>
  </defs>

  <!-- ================= BASE INDUSTRIAL FLOOR ================= -->
  <rect x="0" y="0" width="1600" height="1000" fill="#E2E8F0"/>
  <rect x="25" y="20" width="1550" height="960" rx="4" fill="url(#floor-grid)" stroke="#051E4B" stroke-width="6"/>

  <!-- ================= PEDESTRIAN SAFETY PERIMETER (GREEN) ================= -->
  <g fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5">
    <rect x="35" y="30" width="1530" height="20" rx="2"/>
    <rect x="35" y="950" width="1530" height="20" rx="2"/>
    <rect x="35" y="50" width="20" height="900" rx="2"/>
    <rect x="1545" y="50" width="20" height="900" rx="2"/>
    <rect x="1200" y="50" width="18" height="900" rx="2"/>
    <rect x="495" y="580" width="18" height="370" rx="2"/>
  </g>

  <!-- Crosswalks -->
  <rect x="1195" y="525" width="28" height="52" fill="url(#zebra-v)" stroke="#16A34A" stroke-width="1"/>
  <rect x="490" y="525" width="28" height="52" fill="url(#zebra-v)" stroke="#16A34A" stroke-width="1"/>
  <rect x="35" y="525" width="20" height="52" fill="url(#zebra-v)" stroke="#16A34A" stroke-width="1"/>

  <!-- ================= FORKLIFT HIGHWAY ================= -->
  <g id="highway">
    <rect x="55" y="525" width="1145" height="52" fill="#FFFDF5" stroke="#F49E03" stroke-width="1.5" stroke-dasharray="8 4"/>
    <line x1="60" y1="551" x2="1195" y2="551" stroke="#F49E03" stroke-width="2" stroke-dasharray="14 8"/>
    <rect x="530" y="542" width="180" height="18" rx="3" fill="#051E4B"/>
    <text x="620" y="555" fill="#F49E03" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="10" text-anchor="middle" letter-spacing="1">FORKLIFT HIGHWAY</text>
  </g>

  <!-- ================= 1. CHARGING AREA (RECARGA AGV) ================= -->
  <g id="charging-zone">
    <rect x="65" y="60" width="225" height="145" rx="4" fill="#FFFFFF" stroke="#051E4B" stroke-width="1.5"/>
    <rect x="65" y="60" width="225" height="22" fill="#051E4B"/>
    <text x="177" y="75" fill="#F49E03" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10.5" text-anchor="middle" letter-spacing="0.5">RECARGA DE AGVs</text>
    
    <g fill="#F8FAFC" stroke="#051E4B" stroke-width="1.2" stroke-dasharray="4 2">
      <rect x="75" y="92" width="48" height="46" rx="3"/>
      <rect x="153" y="92" width="48" height="46" rx="3"/>
      <rect x="231" y="92" width="48" height="46" rx="3"/>
      <rect x="75" y="148" width="48" height="46" rx="3"/>
      <rect x="153" y="148" width="48" height="46" rx="3"/>
      <rect x="231" y="148" width="48" height="46" rx="3"/>
    </g>
    <g fill="#051E4B" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">
      <text x="99" y="118">CH-01</text>
      <text x="177" y="118">CH-02</text>
      <text x="255" y="118">CH-03</text>
      <text x="99" y="174">CH-04</text>
      <text x="177" y="174">CH-05</text>
      <text x="255" y="174">CH-06</text>
    </g>
  </g>

  <!-- ================= 2. MAINTENANCE AREA (OFICINA) ================= -->
  <g id="maintenance-zone">
    <rect x="300" y="60" width="210" height="145" rx="4" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="300" y="60" width="210" height="6" fill="url(#hazard-pattern)"/>
    <rect x="300" y="66" width="210" height="20" fill="#051E4B"/>
    <text x="405" y="80" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10.5" text-anchor="middle" letter-spacing="0.5">MANUTENÇÃO &amp; OFICINA</text>

    <rect x="315" y="98" width="80" height="92" rx="3" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
    <text x="355" y="148" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">BANCADA-01</text>
    <rect x="415" y="98" width="80" height="92" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4 2"/>
    <text x="455" y="142" fill="#DC2626" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">BOX REPARO</text>
    <text x="455" y="156" fill="#DC2626" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" text-anchor="middle">CRÍTICO</text>
  </g>

  <!-- ================= 3. PICKING AREA (SEPARAÇÃO) ================= -->
  <g id="picking-zone">
    <rect x="520" y="60" width="670" height="145" rx="4" fill="#FFFFFF" stroke="#051E4B" stroke-width="1.5"/>
    <rect x="520" y="60" width="670" height="22" fill="#051E4B"/>
    <text x="855" y="75" fill="#F49E03" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="0.5">PICKING &amp; SEPARAÇÃO DE PEDIDOS</text>
  </g>

  <!-- ================= 4. SHIPPING DOCKS (EXPEDIÇÃO) ================= -->
  <g id="shipping-zone">
    <rect x="1225" y="60" width="310" height="880" rx="4" fill="#FFFFFF" stroke="#051E4B" stroke-width="1.5"/>
    <rect x="1225" y="60" width="310" height="24" fill="#051E4B"/>
    <text x="1380" y="76" fill="#F49E03" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="0.5">EXPEDIÇÃO &amp; DOCAS OUTBOUND</text>

    <!-- Shipping Dock Bays with High-Contrast Badges -->
    <!-- DOCK 01 -->
    <g id="dock-s01">
      <rect x="1315" y="105" width="210" height="125" rx="3" fill="#F8FAFC" stroke="#051E4B" stroke-width="1.5"/>
      <rect x="1320" y="110" width="135" height="18" rx="3" fill="#051E4B"/>
      <text x="1387" y="122" fill="#F49E03" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.5">DOCA 01 (EXPEDIÇÃO)</text>
    </g>

    <!-- DOCK 02 -->
    <g id="dock-s02">
      <rect x="1315" y="265" width="210" height="125" rx="3" fill="#F8FAFC" stroke="#051E4B" stroke-width="1.5"/>
      <rect x="1320" y="270" width="135" height="18" rx="3" fill="#051E4B"/>
      <text x="1387" y="282" fill="#F49E03" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.5">DOCA 02 (EXPEDIÇÃO)</text>
    </g>

    <!-- DOCK 03 -->
    <g id="dock-s03">
      <rect x="1315" y="425" width="210" height="125" rx="3" fill="#F8FAFC" stroke="#051E4B" stroke-width="1.5"/>
      <rect x="1320" y="430" width="135" height="18" rx="3" fill="#051E4B"/>
      <text x="1387" y="442" fill="#F49E03" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.5">DOCA 03 (EXPEDIÇÃO)</text>
    </g>

    <!-- Outbound Buffer Box -->
    <rect x="1235" y="720" width="285" height="195" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="1377" y="735" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">BUFFER OUTBOUND</text>
  </g>

  <!-- ================= 5. RECEIVING DOCKS & INBOUND ================= -->
  <g id="receiving-zone">
    <rect x="65" y="600" width="415" height="340" rx="4" fill="#FFFFFF" stroke="#051E4B" stroke-width="1.5"/>
    <rect x="65" y="600" width="415" height="24" fill="#051E4B"/>
    <text x="272" y="616" fill="#F49E03" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="0.5">RECEBIMENTO &amp; INBOUND DOCKS</text>

    <!-- 3 Inbound Docks on Left Wall with High-Contrast Badges -->
    <!-- DOCK R-01 -->
    <g id="dock-r01">
      <rect x="75" y="635" width="180" height="85" rx="3" fill="#F8FAFC" stroke="#051E4B" stroke-width="1.5"/>
      <rect x="80" y="638" width="140" height="16" rx="2" fill="#051E4B"/>
      <text x="150" y="649" fill="#F49E03" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">DOCA R-01 (RECEBIMENTO)</text>
    </g>

    <!-- DOCK R-02 -->
    <g id="dock-r02">
      <rect x="75" y="730" width="180" height="85" rx="3" fill="#F8FAFC" stroke="#051E4B" stroke-width="1.5"/>
      <rect x="80" y="733" width="140" height="16" rx="2" fill="#051E4B"/>
      <text x="150" y="744" fill="#F49E03" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">DOCA R-02 (RECEBIMENTO)</text>
    </g>

    <!-- DOCK R-03 -->
    <g id="dock-r03">
      <rect x="75" y="825" width="180" height="85" rx="3" fill="#F8FAFC" stroke="#051E4B" stroke-width="1.5"/>
      <rect x="80" y="828" width="140" height="16" rx="2" fill="#051E4B"/>
      <text x="150" y="839" fill="#F49E03" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">DOCA R-03 (RECEBIMENTO)</text>
    </g>

    <rect x="270" y="635" width="195" height="135" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="367" y="650" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">STAGING &amp; TRIAGEM</text>

    <rect x="270" y="785" width="195" height="135" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="367" y="800" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">BUFFER DE ENTRADA</text>
  </g>

  <!-- ================= 6. STORAGE RACKS OUTLINES (WIDTH = 56px) ================= -->
  <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 2" fill="none">
    <!-- Corredores 1 a 8 -->
    <rect x="90" y="235" width="56" height="265" rx="2"/>
    <rect x="154" y="235" width="56" height="265" rx="2"/>
    <rect x="232" y="235" width="56" height="265" rx="2"/>
    <rect x="296" y="235" width="56" height="265" rx="2"/>
    <rect x="374" y="235" width="56" height="265" rx="2"/>
    <rect x="438" y="235" width="56" height="265" rx="2"/>
    <rect x="516" y="235" width="56" height="265" rx="2"/>
    <rect x="580" y="235" width="56" height="265" rx="2"/>
    <rect x="658" y="235" width="56" height="265" rx="2"/>
    <rect x="722" y="235" width="56" height="265" rx="2"/>
    <rect x="800" y="235" width="56" height="265" rx="2"/>
    <rect x="864" y="235" width="56" height="265" rx="2"/>
    <rect x="942" y="235" width="56" height="265" rx="2"/>
    <rect x="1006" y="235" width="56" height="265" rx="2"/>
    <rect x="1084" y="235" width="56" height="265" rx="2"/>
    <rect x="1148" y="235" width="56" height="265" rx="2"/>

    <!-- Lower Corredores 9 a 13 -->
    <rect x="516" y="605" width="56" height="315" rx="2"/>
    <rect x="580" y="605" width="56" height="315" rx="2"/>
    <rect x="658" y="605" width="56" height="315" rx="2"/>
    <rect x="722" y="605" width="56" height="315" rx="2"/>
    <rect x="800" y="605" width="56" height="315" rx="2"/>
    <rect x="864" y="605" width="56" height="315" rx="2"/>
    <rect x="942" y="605" width="56" height="315" rx="2"/>
    <rect x="1006" y="605" width="56" height="315" rx="2"/>
    <rect x="1084" y="605" width="56" height="315" rx="2"/>
    <rect x="1148" y="605" width="56" height="315" rx="2"/>
  </g>
</svg>
